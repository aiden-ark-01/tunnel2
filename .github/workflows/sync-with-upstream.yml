name: 'Sync fork with upstream (edgetunnel)'

on:
  schedule:
    # 每天 UTC 00:00 自动运行一次
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动点击运行
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync latest commits from cmliu/edgetunnel

    steps:
      # 拉取完整历史（fetch-depth: 0），避免浅克隆导致 "refusing to merge unrelated histories"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main
          git merge upstream/main -m "Sync with upstream cmliu/edgetunnel"
          git push origin main
